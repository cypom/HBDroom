<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->
  <main id="login-screen">

    <div class="login-box">

      <div class="login-title">
        BIRTHDAY SYSTEM
      </div>

      <div class="login-line">
        身分確認中，檢測
      </div>

      <div class="login-sub">
        PLEASE ENTER THE PASSWORD
      </div>

      <input
        id="password-input"
        type="password"
        maxlength="4"
        placeholder="••••"
        autocomplete="off"
      >

      <button id="login-button">
        ENTER
      </button>

      <div id="login-message"></div>

    </div>

  </main>


  <!-- =========================
       GAME
  ========================== -->
  <main id="game-screen">

    <div class="game-header">
      <div class="game-title">ROOM 0530</div>
      <div id="progress-text">TREASURES FOUND : 0 / 5</div>
    </div>


    <!-- =========================
         PIXEL ROOM
    ========================== -->
    <section class="room">

      <!-- WALL -->
      <div class="wall"></div>

      <!-- FLOOR -->
      <div class="floor"></div>


      <!-- =====================
           WINDOW
      ====================== -->
      <div class="window-object">

        <div class="window-frame">

          <div class="window-glass">
            <div class="moon"></div>
            <div class="star star1"></div>
            <div class="star star2"></div>
            <div class="star star3"></div>
          </div>

          <div class="curtain left-curtain"></div>
          <div class="curtain right-curtain"></div>

        </div>

      </div>


      <!-- =====================
           WALL PICTURE
      ====================== -->
      <button
        class="object-button picture-button"
        id="picture-object"
      >
        <div class="picture-frame">
          <div class="picture-inner">
            B
          </div>
        </div>
      </button>


      <!-- =====================
           CLOCK
      ====================== -->
      <button
        class="object-button clock-button"
        id="clock-object"
      >
        <div class="pixel-clock">

          <div class="clock-face">
            <span class="clock-hand hour-hand"></span>
            <span class="clock-hand minute-hand"></span>
            <span class="clock-center"></span>
          </div>

          <div class="clock-time">
            10:05
          </div>

        </div>
      </button>


      <!-- =====================
           WARDROBE
      ====================== -->
      <button
        class="object-button wardrobe-button"
        id="wardrobe-object"
      >

        <div class="wardrobe">

          <div class="wardrobe-top"></div>

          <div class="wardrobe-door left-door">
            <span></span>
          </div>

          <div class="wardrobe-door right-door">
            <span></span>
          </div>

          <div class="wardrobe-feet"></div>

        </div>

      </button>


      <!-- =====================
           BED
      ====================== -->
      <button
        class="object-button bed-button"
        id="bed-object"
      >

        <div class="bed">

          <div class="pillow"></div>

          <div class="blanket">
            <div class="blanket-pattern"></div>
          </div>

          <div class="bed-frame"></div>

          <div class="bed-leg leg-left"></div>
          <div class="bed-leg leg-right"></div>

        </div>

      </button>


      <!-- =====================
           RUG
      ====================== -->
      <button
        class="object-button rug-button"
        id="rug-object"
      >
        <div class="rug">

          <div class="rug-pattern">
            ✦　✦　✦
          </div>

        </div>
      </button>


      <!-- =====================
           DESK
      ====================== -->
      <div class="desk-object">

        <div class="desk-top">

          <div class="desk-surface"></div>

          <!-- DIARY -->
          <button
            class="object-button diary-button"
            id="diary-object"
          >
            <div class="diary">
              <div class="diary-cover">
                DIARY
              </div>
              <div class="diary-page"></div>
            </div>
          </button>


          <!-- CAKE -->
          <button
            class="object-button cake-button"
            id="cake-object"
          >

            <div class="cake">

              <div class="cake-top">
                <span></span>
                <span></span>
                <span></span>
              </div>

              <div class="cake-body"></div>

              <div class="cake-plate"></div>

            </div>

          </button>


          <!-- SPEAKER -->
          <button
            class="object-button speaker-button"
            id="speaker-object"
          >

            <div class="speaker">

              <div class="speaker-top"></div>

              <div class="speaker-body">
                <div class="speaker-circle"></div>
                <div class="speaker-circle small"></div>
              </div>

            </div>

          </button>

        </div>


        <div class="desk-drawer">
          <div class="drawer-handle"></div>
        </div>

        <div class="desk-leg desk-leg-left"></div>
        <div class="desk-leg desk-leg-right"></div>

      </div>


      <!-- =====================
           DOG
      ====================== -->
      <button
        class="object-button dog-button"
        id="dog-object"
      >

        <div class="dog">

          <div class="dog-ear left-ear"></div>
          <div class="dog-ear right-ear"></div>

          <div class="dog-head">

            <div class="dog-eye left-eye"></div>
            <div class="dog-eye right-eye"></div>

            <div class="dog-muzzle"></div>

            <div class="dog-nose"></div>

          </div>

          <div class="dog-body"></div>

          <div class="dog-paw left-paw"></div>
          <div class="dog-paw right-paw"></div>

        </div>

      </button>


      <!-- =====================
           LAMP
      ====================== -->
      <div class="lamp-object">

        <div class="lamp-shade"></div>
        <div class="lamp-pole"></div>
        <div class="lamp-base"></div>

      </div>


      <!-- =====================
           ROOM LABEL
      ====================== -->
      <div class="room-label">
        05 : 30 PM
      </div>


      <!-- =====================
           CLICK MESSAGE
      ====================== -->
      <div id="room-message"></div>

    </section>


    <!-- =========================
         MODAL
    ========================== -->
    <div id="modal">

      <div class="modal-box">

        <button id="modal-close">
          ×
        </button>

        <div id="modal-title"></div>

        <div id="modal-content"></div>

        <div id="modal-input-area"></div>

        <button id="modal-action">
          CONTINUE
        </button>

      </div>

    </div>


    <!-- =========================
         FINAL
    ========================== -->
    <div id="final-screen">

      <div class="final-box">

        <div class="final-cake">
          🎂
        </div>

        <div class="final-title">
          HAPPY BIRTHDAY
        </div>

        <div class="final-name">
          【朋友的名字】
        </div>

        <div class="final-letter">
          謝謝你出現在我的青春裡。<br>
          願你新的一歲，也一直被溫柔對待。
        </div>

      </div>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
